contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-base
    - go-1.25
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: appgroup
      gid: 1000
  users:
    - username: appuser
      uid: 1000
      gid: 1000
  run-as: appuser

environment:
  GOPATH: /home/appuser/go
  PATH: /usr/lib/go/bin:/home/appuser/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

archs:
  - x86_64
  - aarch64