contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-base
    - openjdk-25
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: appgroup
      gid: 1000
  users:
    - username: appuser
      uid: 1000
      gid: 1000
  run-as: appuser

environment:
  JAVA_HOME: /usr/lib/jvm/java-25-openjdk
  PATH: /usr/lib/jvm/java-25-openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

archs:
  - x86_64
  - aarch64

