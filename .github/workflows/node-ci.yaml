name: Build and Push Wolfi Node Image

on:
  push:
    branches: [ master ]
    paths:
      - 'images/wolfi-node/**'
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  scan-architectures:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        version: ['20', '22', '24']
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            tar: amd64.tar
          - arch: aarch64
            tar: arm64.tar
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build ${{ matrix.version }} on ${{ matrix.arch }} Locally
        run: |
          CONFIG_FILE="images/wolfi-node/wolfi-node-${{ matrix.version }}.yaml"
          mkdir -p sbom-${{ matrix.version }}-${{ matrix.arch }}
          docker run --rm -v "${{ github.workspace }}":/work -w /work \
            cgr.dev/chainguard/apko:latest build \
            $CONFIG_FILE \
            kenzman/ns-wolfi-node:${{ matrix.version }}-${{ matrix.arch }} \
            node-${{ matrix.version }}-${{ matrix.tar }} --arch ${{ matrix.arch }} \
            --sbom-path sbom-${{ matrix.version }}-${{ matrix.arch }}

      - name: Scan ${{ matrix.version }} ${{ matrix.arch }} Tarball
        uses: aquasecurity/trivy-action@master
        with:
          input: 'node-${{ matrix.version }}-${{ matrix.tar }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-sbom-${{ matrix.version }}-${{ matrix.arch }}
          path: sbom-${{ matrix.version }}-${{ matrix.arch }}/

  publish-and-sign:
    needs: scan-architectures
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        version: ['20', '22', '24']
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Final Publish Multi-Arch
        run: |
          CONFIG_FILE="images/wolfi-node/wolfi-node-${{ matrix.version }}.yaml"
          mkdir -p sbom-final-${{ matrix.version }}
          
          docker run --rm \
            -v "${{ github.workspace }}":/work -w /work \
            -e DOCKER_CONFIG=/root/.docker -v /home/runner/.docker:/root/.docker \
            cgr.dev/chainguard/apko:latest publish \
            $CONFIG_FILE \
            ${{ secrets.DOCKERHUB_USERNAME }}/ns-wolfi-node:${{ matrix.version }} \
            --sbom-path sbom-final-${{ matrix.version }}

      - name: Upload Final SBOM
        uses: actions/upload-artifact@v4
        with:
          name: node-sbom-final-${{ matrix.version }}
          path: sbom-final-${{ matrix.version }}/

      - name: Extract Version & Tags
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/ns-wolfi-node"
          TAG="${{ matrix.version }}"
          
          docker pull ${REPO}:${TAG}
          NODE_VER=$(docker run --rm ${REPO}:${TAG} node --version | sed 's/v//')
          MAJOR_VER=$(echo $NODE_VER | cut -d. -f1)
          echo "NODE_FULL_VER=$NODE_VER" >> $GITHUB_ENV
          
          docker buildx imagetools create -t ${REPO}:${NODE_VER} ${REPO}:${TAG}
          docker buildx imagetools create -t ${REPO}:${MAJOR_VER} ${REPO}:${TAG}
          
          # If it is version 24, also tag it as latest
          if [ "${TAG}" == "24" ]; then
             docker buildx imagetools create -t ${REPO}:latest ${REPO}:${TAG}
          fi

      - name: Install Cosign
        uses: sigstore/cosign-installer@main

      - name: Sign and Verify (Audit)
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/ns-wolfi-node"
          TAG="${{ env.NODE_FULL_VER }}"
          DIGEST=$(docker buildx imagetools inspect ${REPO}:${TAG} --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "IMAGE_DIGEST=$DIGEST" >> $GITHUB_ENV
          
          echo "Signing image ${REPO}@${DIGEST}..."
          cosign sign --yes "${REPO}@${DIGEST}"
          
          echo "Waiting for signature to propagate..."
          sleep 30
          
          echo "Verifying signature..."
          for i in {1..10}; do
            echo "Verification attempt $i/10..."
            if cosign verify "${REPO}@${DIGEST}" \
              --certificate-identity-regexp "https://github.com/Ekene95/secops-base-images/.*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"; then
              echo "✅ Signature verified successfully!"
              exit 0
            fi
            echo "Signature not yet available, waiting 30s..."
            sleep 30
          done
          echo "❌ Failed to verify signature after 10 attempts"
          exit 10

      - name: Attach SBOM to Image
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/ns-wolfi-node"
          DIGEST="${{ env.IMAGE_DIGEST }}"
          SBOM_FILE=$(ls sbom-final-${{ matrix.version }}/*.spdx.json | head -1)
          cosign attach sbom --sbom "${SBOM_FILE}" "${REPO}@${DIGEST}"

      - name: Generate Build Summary
        run: |
          echo "### Build Successful for Node ${{ matrix.version }}" >> $GITHUB_STEP_SUMMARY
          echo "Signed and verified multi-arch manifest: \`${{ env.IMAGE_DIGEST }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Notify on Failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"❌ Alert: Build or Security Scan failed for Node ${{ matrix.version }}! \nCheck logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
          ${{ secrets.NOTIFICATION_WEBHOOK }}
