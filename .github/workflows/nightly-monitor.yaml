name: Nightly CVE Monitor
on:
  schedule:
    - cron: '0 0 * * *'
jobs:
  monitor:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [ns-wolfi-go, mpnt-wolfi-java, ns-wolfi-python, ns-wolfi-node]
    steps:
      - name: Scan Registry
        uses: aquasecurity/trivy-action@6e7b7d1fd3e722d42a97280aa2d2ee667541133d
        with:
          image-ref: 'docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest'
          format: 'json'
          output: 'results.json'
      - name: Trigger Rebuild if Vulnerable
        run: |
          COUNT=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH")] | length' results.json)
          if [ "$COUNT" -gt 0 ]; then
            curl -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d "{\"event_type\": \"cve-rebuild-trigger\"}"
          fi