name: Nightly CVE Monitor
on:
  schedule:
    - cron: '0 0 * * *'
jobs:
  monitor:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [ns-wolfi-go, ns-wolfi-go-runtime, mpnt-wolfi-java, ns-wolfi-python, ns-wolfi-node]
    steps:

      - name: Pull fresh image
        run: docker pull docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest

      - name: Login to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Scan with Docker Scout
        id: scout
        continue-on-error: true
        uses: docker/scout-action@v1
        with:
          command: cves
          image: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
          only-severities: critical,high,medium
          exit-code: true
          hub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          hub-pass: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify scanned digest
        run: |
          docker inspect docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest \
            --format '{{index .RepoDigests 0}}'

      - name: Trigger Rebuild if Vulnerable
        if: steps.scout.outcome == 'failure'
        run: |
          curl -f -X POST \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d "{\"event_type\": \"cve-rebuild-trigger\"}"
          echo "Rebuild triggered successfully"