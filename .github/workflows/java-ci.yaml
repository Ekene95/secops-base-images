name: Build and Push Wolfi Java Image

on:
  push:
    branches: [ master ]
    paths:
      - 'images/wolfi-java/**'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  scan-architectures:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        version: ['17', '21', '24', '25']
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            tar: amd64.tar
          - arch: aarch64
            tar: arm64.tar
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Config YAML
        id: pick-config
        run: |
          if [ "${{ matrix.version }}" == "24" ]; then
            echo "config=images/wolfi-java/wolfi-java.yaml" >> $GITHUB_OUTPUT
          else
            echo "config=images/wolfi-java/wolfi-java-${{ matrix.version }}.yaml" >> $GITHUB_OUTPUT
          fi

      - name: Build ${{ matrix.version }} on ${{ matrix.arch }} Locally
        run: |
          CONFIG_FILE="${{ steps.pick-config.outputs.config }}"
          mkdir -p sbom-${{ matrix.version }}-${{ matrix.arch }}
          docker run --rm -v "${{ github.workspace }}":/work -w /work \
            cgr.dev/chainguard/apko:latest build \
            $CONFIG_FILE \
            kenzman/mpnt-wolfi-java:${{ matrix.version }}-${{ matrix.arch }} \
            java-${{ matrix.version }}-${{ matrix.tar }} --arch ${{ matrix.arch }} \
            --sbom-path sbom-${{ matrix.version }}-${{ matrix.arch }}

      - name: Scan ${{ matrix.version }} ${{ matrix.arch }} Tarball
        uses: aquasecurity/trivy-action@master
        with:
          input: 'java-${{ matrix.version }}-${{ matrix.tar }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-sbom-${{ matrix.version }}-${{ matrix.arch }}
          path: sbom-${{ matrix.version }}-${{ matrix.arch }}/

  publish-and-sign:
    needs: scan-architectures
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        version: ['17', '21', '24', '25']
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Determine Config YAML
        id: pick-config
        run: |
          if [ "${{ matrix.version }}" == "24" ]; then
            echo "config=images/wolfi-java/wolfi-java.yaml" >> $GITHUB_OUTPUT
          else
            echo "config=images/wolfi-java/wolfi-java-${{ matrix.version }}.yaml" >> $GITHUB_OUTPUT
          fi

      - name: Final Publish Multi-Arch
        run: |
          CONFIG_FILE="${{ steps.pick-config.outputs.config }}"
          mkdir -p sbom-final-${{ matrix.version }}
          # Determine the docker tag
          TAG="${{ matrix.version }}"
          if [ "${TAG}" == "24" ]; then
             TAG="latest"
          fi
          
          docker run --rm \
            -v "${{ github.workspace }}":/work -w /work \
            -e DOCKER_CONFIG=/root/.docker -v /home/runner/.docker:/root/.docker \
            cgr.dev/chainguard/apko:latest publish \
            $CONFIG_FILE \
            ${{ secrets.DOCKERHUB_USERNAME }}/mpnt-wolfi-java:${TAG} \
            --sbom-path sbom-final-${{ matrix.version }}

      - name: Upload Final SBOM
        uses: actions/upload-artifact@v4
        with:
          name: java-sbom-final-${{ matrix.version }}
          path: sbom-final-${{ matrix.version }}/

      - name: Extract Version & Tags
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/mpnt-wolfi-java"
          TAG="${{ matrix.version }}"
          if [ "${TAG}" == "24" ]; then
             TAG="latest"
          fi
          
          docker pull ${REPO}:${TAG}
          JAVA_VER=$(docker run --rm ${REPO}:${TAG} java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          MAJOR_VER=$(echo $JAVA_VER | cut -d. -f1)
          echo "JAVA_FULL_VER=$JAVA_VER" >> $GITHUB_ENV
          
          # We manually tag the exact full version (e.g. 17.0.14)
          docker buildx imagetools create -t ${REPO}:${JAVA_VER} ${REPO}:${TAG}
          
          # We tag the major version (e.g. 17)
          docker buildx imagetools create -t ${REPO}:${MAJOR_VER} ${REPO}:${TAG}
          
          # If matrix version is 24, also explicitly ensure latest is tagged/updated
          if [ "${{ matrix.version }}" == "24" ]; then
             docker buildx imagetools create -t ${REPO}:latest ${REPO}:${TAG}
          fi

      - name: Install Cosign
        uses: sigstore/cosign-installer@main

      - name: Sign and Verify (Audit)
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/mpnt-wolfi-java"
          # Sign the newly extracted exact full version tag
          TAG="${{ env.JAVA_FULL_VER }}"
          DIGEST=$(docker buildx imagetools inspect ${REPO}:${TAG} --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "IMAGE_DIGEST=$DIGEST" >> $GITHUB_ENV
          
          echo "Signing image ${REPO}@${DIGEST}..."
          cosign sign --yes "${REPO}@${DIGEST}"
          
          echo "Waiting for signature to propagate..."
          sleep 30
          
          echo "Verifying signature..."
          for i in {1..10}; do
            echo "Verification attempt $i/10..."
            if cosign verify "${REPO}@${DIGEST}" \
              --certificate-identity-regexp "https://github.com/Ekene95/secops-base-images/.*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"; then
              echo "✅ Signature verified successfully!"
              exit 0
            fi
            echo "Signature not yet available, waiting 30s..."
            sleep 30
          done
          echo "❌ Failed to verify signature after 10 attempts"
          exit 10

      - name: Attach SBOM to Image
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/mpnt-wolfi-java"
          DIGEST="${{ env.IMAGE_DIGEST }}"
          SBOM_FILE=$(ls sbom-final-${{ matrix.version }}/*.spdx.json | head -1)
          cosign attach sbom --sbom "${SBOM_FILE}" "${REPO}@${DIGEST}"

      - name: Generate Build Summary
        run: |
          echo "### Build Successful for Java ${{ matrix.version }}" >> $GITHUB_STEP_SUMMARY
          echo "Signed and verified multi-arch manifest: \`${{ env.IMAGE_DIGEST }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Notify on Failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"❌ Alert: Build or Security Scan failed for Java ${{ matrix.version }}! \nCheck logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
          ${{ secrets.NOTIFICATION_WEBHOOK }}
