name: Build and Push Wolfi Java Image

on:
  push:
    branches: [ master ]
    paths:
      - 'images/wolfi-java/wolfi-java.yaml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write 
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-Arch with apko
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/work \
            -w /work \
            cgr.dev/chainguard/apko:latest build \
            images/wolfi-java/wolfi-java.yaml \
            mpnt-wolfi-java:latest \
            output.tar \
            --arch x86_64,aarch64

      - name: Load Images into Docker
        run: docker load < output.tar

      - name: Scan x86_64 Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mpnt-wolfi-java:latest-amd64'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Scan ARM64 Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mpnt-wolfi-java:latest-arm64'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Dynamic Tagging and Push
        run: |
          # Detect Java version
          JAVA_VER=$(docker run --rm mpnt-wolfi-java:latest-amd64 java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          MAJOR_VER=$(echo $JAVA_VER | cut -d. -f1)
          
          echo "JAVA_FULL_VER=$JAVA_VER" >> $GITHUB_ENV
          echo "JAVA_MAJOR_VER=$MAJOR_VER" >> $GITHUB_ENV
          
          USER="${{ secrets.DOCKERHUB_USERNAME }}"
          REPO="${USER}/mpnt-wolfi-java"

          # Push helper tags
          for ARCH in amd64 arm64; do
            docker tag mpnt-wolfi-java:latest-${ARCH} ${REPO}:${JAVA_VER}-${ARCH}
            docker push ${REPO}:${JAVA_VER}-${ARCH}
          done

      - name: Create Multi-Arch Manifest (Buildx Imagetools)
        run: |
          USER="${{ secrets.DOCKERHUB_USERNAME }}"
          REPO="${USER}/mpnt-wolfi-java"
          VER=$JAVA_FULL_VER
          MAJOR=$JAVA_MAJOR_VER

          # Create the multi-arch manifest using Imagetools
          # This command creates the index and pushes it in one step
          docker buildx imagetools create -t ${REPO}:${VER} \
            ${REPO}:${VER}-amd64 \
            ${REPO}:${VER}-arm64

          docker buildx imagetools create -t ${REPO}:${MAJOR} \
            ${REPO}:${VER}-amd64 \
            ${REPO}:${VER}-arm64

          docker buildx imagetools create -t ${REPO}:latest \
            ${REPO}:${VER}-amd64 \
            ${REPO}:${VER}-arm64

      - name: Clean Up Clutter Tags
        if: always()
        run: |
          # Obtain JWT token
          TOKEN=$(curl -s -H "Content-Type: application/json" -X POST \
            -d '{"username": "'${{ secrets.DOCKERHUB_USERNAME }}'", "password": "'${{ secrets.DOCKERHUB_TOKEN }}'"}' \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
          
          REPO_PATH="${{ secrets.DOCKERHUB_USERNAME }}/mpnt-wolfi-java"
          
          # Delete helper tags using the new Full Access PAT
          for TAG in "${JAVA_FULL_VER}-amd64" "${JAVA_FULL_VER}-arm64"; do
            echo "Deleting tag: $TAG"
            curl -s -X DELETE -H "Authorization: JWT ${TOKEN}" \
              "https://hub.docker.com/v2/repositories/${REPO_PATH}/tags/${TAG}/"
          done

      - name: Install Cosign
        uses: sigstore/cosign-installer@main

      - name: Sign and Verify Final Image
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/mpnt-wolfi-java"
          cosign sign --yes ${REPO}:${{ env.JAVA_FULL_VER }}
          cosign verify ${REPO}:${{ env.JAVA_FULL_VER }} \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
