name: Build and Push Wolfi Java Image

on:
  push:
    branches: [ master ]
    paths:
      - 'images/wolfi-java/wolfi-java.yaml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Cosign keyless signing
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Multi-Arch with apko
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/work \
            -w /work \
            cgr.dev/chainguard/apko:latest build \
            images/wolfi-java/wolfi-java.yaml \
            mpnt-wolfi-java:latest \
            output.tar

      - name: Load Images into Docker
        run: docker load < output.tar

      - name: Scan x86_64 Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mpnt-wolfi-java:latest-amd64'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '1'

      - name: Scan ARM64 Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mpnt-wolfi-java:latest-arm64'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          exit-code: '1'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push by Digest and Extract Version
        id: push_step
        run: |
          # 1. Detect Java version (e.g., 24.0.2) from the built image
          JAVA_VER=$(docker run --rm mpnt-wolfi-java:latest-amd64 java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          MAJOR_VER=$(echo $JAVA_VER | cut -d. -f1)
          
          echo "JAVA_FULL_VER=$JAVA_VER" >> $GITHUB_ENV
          echo "JAVA_MAJOR_VER=$MAJOR_VER" >> $GITHUB_ENV
          
          USER=${{ secrets.DOCKERHUB_USERNAME }}
          REPO="$USER/mpnt-wolfi-java"

          # 2. Push images by Digest to keep the UI clean
          # We tag them with a temporary name, push, then capture the digest
          # The digest is immutable and doesn't create a visible "tag" on the UI once the manifest exists
          
          # Push AMD64
          docker tag mpnt-wolfi-java:latest-amd64 ${REPO}:tmp-amd64
          AMD64_DIGEST=$(docker push ${REPO}:tmp-amd64 | grep digest | awk '{print $3}')
          echo "AMD64_DIGEST=${AMD64_DIGEST}" >> $GITHUB_ENV
          
          # Push ARM64
          docker tag mpnt-wolfi-java:latest-arm64 ${REPO}:tmp-arm64
          ARM64_DIGEST=$(docker push ${REPO}:tmp-arm64 | grep digest | awk '{print $3}')
          echo "ARM64_DIGEST=${ARM64_DIGEST}" >> $GITHUB_ENV

      - name: Create and Push Multi-Arch Manifests
        run: |
          USER=${{ secrets.DOCKERHUB_USERNAME }}
          REPO="$USER/mpnt-wolfi-java"
          VER=$JAVA_FULL_VER
          MAJOR=$JAVA_MAJOR_VER
          
          # Use the digests to build the manifest. This "hides" the arch tags.
          AMD_REF="${REPO}@${AMD64_DIGEST}"
          ARM_REF="${REPO}@${ARM64_DIGEST}"

          # Create Manifests for Full Version, Major Version, and Latest
          for TAG in $VER $MAJOR latest; do
            docker manifest create ${REPO}:${TAG} ${AMD_REF} ${ARM_REF}
            docker manifest push ${REPO}:${TAG}
          done

      - name: Install Cosign
        uses: sigstore/cosign-installer@main

      - name: Sign the Clean Tags
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/mpnt-wolfi-java"
          VER=$JAVA_FULL_VER
          MAJOR=$JAVA_MAJOR_VER
          
          # Sign the manifest indexes (the public-facing tags)
          cosign sign --yes ${REPO}:${VER}
          cosign sign --yes ${REPO}:${MAJOR}
          cosign sign --yes ${REPO}:latest

      - name: Verify Signature
        run: |
          cosign verify ${{ secrets.DOCKERHUB_USERNAME }}/mpnt-wolfi-java:${{ env.JAVA_FULL_VER }} \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
