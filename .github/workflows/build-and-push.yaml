name: Build and Push Wolfi Java Image

on:
  push:
    branches: [ master ]
    paths:
      - 'images/wolfi-java/wolfi-java.yaml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write 
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Multi-Arch with apko
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/work \
            -w /work \
            cgr.dev/chainguard/apko:latest build \
            images/wolfi-java/wolfi-java.yaml \
            mpnt-wolfi-java:latest \
            output.tar

      - name: Load Images into Docker
        run: docker load < output.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Dynamic Tagging and Push
        run: |
          # 1. Detect Java version (e.g., 24.0.2)
          JAVA_VER=$(docker run --rm mpnt-wolfi-java:latest-amd64 java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          MAJOR_VER=$(echo $JAVA_VER | cut -d. -f1)
          
          echo "Detected Java: $JAVA_VER"
          echo "JAVA_FULL_VER=$JAVA_VER" >> $GITHUB_ENV
          echo "JAVA_MAJOR_VER=$MAJOR_VER" >> $GITHUB_ENV
          
          USER="${{ secrets.DOCKERHUB_USERNAME }}"
          REPO="${USER}/mpnt-wolfi-java"

          # 2. Push arch tags (Required for Docker Hub to accept the manifest)
          for ARCH in amd64 arm64; do
            docker tag mpnt-wolfi-java:latest-${ARCH} ${REPO}:${JAVA_VER}-${ARCH}
            docker push ${REPO}:${JAVA_VER}-${ARCH}
          done

      - name: Create and Push Multi-Arch Manifests
        run: |
          USER="${{ secrets.DOCKERHUB_USERNAME }}"
          REPO="${USER}/mpnt-wolfi-java"
          VER=$JAVA_FULL_VER
          MAJOR=$JAVA_MAJOR_VER
          
          # 3. Create manifest using the tags we just pushed
          for TAG in $VER $MAJOR latest; do
            docker manifest create ${REPO}:${TAG} \
              --amend ${REPO}:${VER}-amd64 \
              --amend ${REPO}:${VER}-arm64
            docker manifest push ${REPO}:${TAG}
          done

      - name: Clean Up Tags from Docker Hub
        if: always()
        run: |
          # 4. Get JWT using your new Full Access Token
          TOKEN=$(curl -s -H "Content-Type: application/json" -X POST \
            -d '{"username": "'${{ secrets.DOCKERHUB_USERNAME }}'", "password": "'${{ secrets.DOCKERHUB_TOKEN }}'"}' \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
          
          REPO_PATH="${{ secrets.DOCKERHUB_USERNAME }}/mpnt-wolfi-java"
          
          # 5. Delete the temporary architecture tags
          for ARCH_TAG in "${JAVA_FULL_VER}-amd64" "${JAVA_FULL_VER}-arm64"; do
            echo "Deleting tag: $ARCH_TAG"
            curl -s -X DELETE \
              -H "Authorization: JWT ${TOKEN}" \
              "https://hub.docker.com/v2/repositories/${REPO_PATH}/tags/${ARCH_TAG}/"
          done

      - name: Install Cosign
        uses: sigstore/cosign-installer@main

      - name: Sign and Verify (The Security Seal)
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/mpnt-wolfi-java"
          cosign sign --yes ${REPO}:${JAVA_FULL_VER}
          cosign verify ${REPO}:${JAVA_FULL_VER} \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
