name: Build Node
on:
  push:
    paths: [ 'images/wolfi-node/**' ]
  repository_dispatch:
    types: [ cve-rebuild-trigger ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  discover-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.get-versions.outputs.versions }}
    steps:
      - name: Get Wolfi Node Versions
        id: get-versions
        run: |
          # Automated Discovery Logic for Node
          VERSIONS=$(curl -s https://packages.wolfi.dev/os/x86_64/APKINDEX.tar.gz | tar -xOz APKINDEX | grep -oP 'nodejs-\d+' | cut -d- -f2 | sort -uV | grep -E '^20|^22|^24' | jq -R . | jq -s -c .)
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT

  trigger-factory:
    needs: discover-versions
    strategy:
      matrix:
        version: ${{ fromJson(needs.discover-versions.outputs.versions) }}
    uses: ./.github/workflows/factory-engine.yaml
    with:
      runtime: "node"
      config_path: "images/wolfi-node/wolfi-node-${{ matrix.version }}.yaml"
      repo_name: "ns-wolfi-node"
      target_tag: ${{ matrix.version == '24' && 'latest' || matrix.version }}
      version_cmd: "node --version | sed 's/v//'"
      major_version_cmd: "cut -d. -f1"
    secrets: inherit
