name: Build and Push Wolfi Python Image

on:
  push:
    branches: [ master ]
    paths:
      - 'images/wolfi-python/**'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  scan-architectures:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            tar: py-amd64.tar
          - arch: aarch64
            tar: py-arm64.tar
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build ${{ matrix.arch }} Locally
        run: |
          mkdir -p sbom-${{ matrix.arch }}
          docker run --rm -v "${{ github.workspace }}":/work -w /work \
            cgr.dev/chainguard/apko:latest build \
            images/wolfi-python/wolfi-python.yaml \
            kenzman/ns-wolfi-python:local \
            ${{ matrix.tar }} --arch ${{ matrix.arch }} \
            --sbom-path sbom-${{ matrix.arch }}

      - name: Scan ${{ matrix.arch }} Tarball
        uses: aquasecurity/trivy-action@0.35.0
        with:
          input: '${{ matrix.tar }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-sbom-${{ matrix.arch }}
          path: sbom-${{ matrix.arch }}/

  publish-and-sign:
    needs: scan-architectures
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Final Publish Multi-Arch
        run: |
          mkdir -p sbom-final
          docker run --rm \
            -v "${{ github.workspace }}":/work -w /work \
            -e DOCKER_CONFIG=/root/.docker -v /home/runner/.docker:/root/.docker \
            cgr.dev/chainguard/apko:latest publish \
            images/wolfi-python/wolfi-python.yaml \
            ${{ secrets.DOCKERHUB_USERNAME }}/ns-wolfi-python:latest \
            --sbom-path sbom-final

      - name: Upload Final SBOM
        uses: actions/upload-artifact@v4
        with:
          name: python-sbom-final
          path: sbom-final/

      - name: Extract Python Version & Tags
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/ns-wolfi-python"
          docker pull ${REPO}:latest
          PY_FULL_VER=$(docker run --rm ${REPO}:latest python --version | cut -d' ' -f2)
          PY_MAJOR_VER=$(echo $PY_FULL_VER | cut -d. -f1-2)
          echo "PY_VER=$PY_FULL_VER" >> $GITHUB_ENV
          
          # Exact version
          docker buildx imagetools create -t ${REPO}:${PY_FULL_VER} ${REPO}:latest
          
          # Major version
          docker buildx imagetools create -t ${REPO}:${PY_MAJOR_VER} ${REPO}:latest
          
          # Latest
          docker buildx imagetools create -t ${REPO}:latest ${REPO}:latest

      - name: Install Cosign & Sign
        uses: sigstore/cosign-installer@main

      - name: Sign and Verify (Audit)
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/ns-wolfi-python"
          TAG="${{ env.PY_VER }}"
          DIGEST=$(docker buildx imagetools inspect ${REPO}:${TAG} --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "IMAGE_DIGEST=$DIGEST" >> $GITHUB_ENV
          
          echo "Signing image ${REPO}@${DIGEST}..."
          cosign sign --yes "${REPO}@${DIGEST}"
          
          echo "Waiting for signature to propagate..."
          sleep 30
          
          echo "Verifying signature..."
          for i in {1..10}; do
            echo "Verification attempt $i/10..."
            if cosign verify "${REPO}@${DIGEST}" \
              --certificate-identity-regexp "https://github.com/Ekene95/secops-base-images/.*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"; then
              echo "✅ Signature verified successfully!"
              exit 0
            fi
            echo "Signature not yet available, waiting 30s..."
            sleep 30
          done
          echo "❌ Failed to verify signature after 10 attempts"
          exit 10

      - name: Attach SBOM to Image
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/ns-wolfi-python"
          DIGEST="${{ env.IMAGE_DIGEST }}"
          SBOM_FILE=$(ls sbom-final/*.spdx.json | head -1)
          cosign attach sbom --sbom "${SBOM_FILE}" "${REPO}@${DIGEST}"

      - name: Notify on Failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"❌ Alert: **Wolfi-Python** build failed! \nLogs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
          ${{ secrets.NOTIFICATION_WEBHOOK }}