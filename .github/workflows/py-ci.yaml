name: Build and Push Wolfi Python Image

on:
  push:
    branches: [ master ]
    paths:
      - 'images/wolfi-python/**'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  scan-architectures:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            tar: py-amd64.tar
          - arch: aarch64
            tar: py-arm64.tar
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build ${{ matrix.arch }} Locally
        run: |
          docker run --rm -v "${{ github.workspace }}":/work -w /work \
            cgr.dev/chainguard/apko:latest build \
            images/wolfi-python/wolfi-python.yaml \
            kenzman/mpnt-wolfi-python:local \
            ${{ matrix.tar }} --arch ${{ matrix.arch }}

      - name: Scan ${{ matrix.arch }} Tarball
        uses: aquasecurity/trivy-action@master
        with:
          input: '${{ matrix.tar }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  publish-and-sign:
    needs: scan-architectures
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Final Publish Multi-Arch
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/work -w /work \
            -e DOCKER_CONFIG=/root/.docker -v /home/runner/.docker:/root/.docker \
            cgr.dev/chainguard/apko:latest publish \
            images/wolfi-python/wolfi-python.yaml \
            ${{ secrets.DOCKERHUB_USERNAME }}/mpnt-wolfi-python:latest

      - name: Extract Python Version & Tags
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/mpnt-wolfi-python"
          docker pull ${REPO}:latest
          PY_VER=$(docker run --rm ${REPO}:latest python --version | cut -d' ' -f2)
          echo "PY_VER=$PY_VER" >> $GITHUB_ENV
          docker buildx imagetools create -t ${REPO}:${PY_VER} ${REPO}:latest

      - name: Install Cosign & Sign
        uses: sigstore/cosign-installer@main

      - name: Sign and Verify (Audit)
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/mpnt-wolfi-python"
          TAG="${{ env.PY_VER }}"
          DIGEST=$(docker buildx imagetools inspect ${REPO}:${TAG} --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "IMAGE_DIGEST=$DIGEST" >> $GITHUB_ENV
          
          cosign sign --yes "${REPO}@${DIGEST}"

          for i in {1..5}; do
            if cosign verify "${REPO}@${DIGEST}" \
              --certificate-identity-regexp "https://github.com/Ekene95/secops-base-images/.*" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com"; then
              exit 0
            fi
            sleep 15
          done
          exit 10

      - name: Notify on Failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"❌ Alert: **Wolfi-Python** build failed! \nLogs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
          ${{ secrets.NOTIFICATION_WEBHOOK }}